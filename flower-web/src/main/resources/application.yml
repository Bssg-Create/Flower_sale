server:
  port: 8081

spring:
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 7200
          cache-public: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/flower_sales?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  mapper-locations: classpath:mapper/**/*.xml

# Knife4j
springdoc:
  swagger-ui:
    path: /swagger-ui.html
knife4j:
  enable: true
  setting:
    language: zh_cn

flower:
  security:
    jwt-secret: ${FLOWER_JWT_SECRET}
  bootstrap:
    admin:
      enabled: ${FLOWER_ADMIN_BOOTSTRAP_ENABLED:false}
      username: ${FLOWER_ADMIN_USERNAME:admin}
      password: ${FLOWER_ADMIN_PASSWORD:}

ai:
  deepseek:
    api-key: ${AI_DEEPSEEK_API_KEY:}
    base-url: https://api.deepseek.com
    model: deepseek-chat
